<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Detection · Red</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #450a0a; color: #fee2e2; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at top, #991b1b, #450a0a 65%); }
      main { width: min(88vw, 680px); padding: 4rem; border: 1px solid #f87171; border-radius: 2rem; background: #7f1d1d; box-shadow: 0 2rem 5rem #1f0000; }
      .skill { color: #fca5a5; letter-spacing: 0.12em; text-transform: uppercase; }
      h1 { margin: 0.75rem 0 1rem; font-size: clamp(3rem, 10vw, 6rem); }
      p { color: #fecaca; font-size: 1.1rem; line-height: 1.7; }
      button { padding: 0.8rem 1.2rem; border: 0; border-radius: 999px; background: #dc2626; color: white; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <div class="skill">detection-red</div>
      <h1>Red page</h1>
      <p>这是 detection 仓库的红色 Skill 测试页面。</p>
      <button type="button">RED DETECTED</button>
    </main>
  </body>
</html>
