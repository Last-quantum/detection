<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apply Green Web Theme</title>
    <style>
      :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #052e16; color: #dcfce7; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: radial-gradient(circle at top, #15803d, #052e16 65%); }
      main { width: min(88vw, 680px); padding: 4rem; border: 1px solid #4ade80; border-radius: 2rem; background: #166534; box-shadow: 0 2rem 5rem #001f0d; }
      .skill { color: #86efac; letter-spacing: 0.12em; text-transform: uppercase; }
      h1 { margin: 0.75rem 0 1rem; font-size: clamp(3rem, 10vw, 6rem); }
      p { color: #bbf7d0; font-size: 1.1rem; line-height: 1.7; }
      button { padding: 0.8rem 1.2rem; border: 0; border-radius: 999px; background: #16a34a; color: white; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <div class="skill">apply-green-web-theme</div>
      <h1>Green page</h1>
      <p>这是绿色网页主题 Skill 的测试页面。</p>
      <button type="button">GREEN THEME APPLIED</button>
    </main>
  </body>
</html>
